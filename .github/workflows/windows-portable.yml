name: Windows x64 Build
run-name: Windows x64 ${{ inputs.build-mode || 'release' }} packages

on:
  workflow_dispatch:
    inputs:
      build-mode:
        description: Flutter build mode
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    paths:
      - ".github/workflows/windows-portable.yml"
      - ".github/workflows/release.yml"
      - "installer/windows/**"
      - "scripts/generate_release_metadata.ps1"
      - "scripts/package_windows_release.ps1"
      - "scripts/verify_windows_binary_architecture.ps1"
      - "lib/core/services/app_installation_service.dart"
      - "lib/data/datasources/remote/github_api_service.dart"
      - "lib/data/models/version/release_asset_info.dart"

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}-${{ inputs.build-mode || 'release' }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2"
  PUB_HOSTED_URL: "https://pub.dev"
  PORTABLE_RECIPE_VERSION: "2"
  WINDOWS_ARCHITECTURE: x64
  BUILD_MODE: ${{ inputs.build-mode || 'release' }}
  BUNDLE_PATH: build/windows/x64/runner/${{ inputs.build-mode == 'debug' && 'Debug' || 'Release' }}

jobs:
  build-windows-x64:
    name: Build Windows x64 ${{ inputs.build-mode || 'release' }} packages
    # A configured persistent runner is reserved for trusted executable refs.
    if: >-
      vars.WINDOWS_FLUTTER_RUNNER == '' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ vars.WINDOWS_FLUTTER_RUNNER || 'windows-2022' }}
    timeout-minutes: 45
    env:
      WINDOWS_CACHE_NAMESPACE: ${{ vars.WINDOWS_FLUTTER_RUNNER != '' && 'nai-self-hosted' || 'nai-hosted' }}

    steps:
      - name: Checkout without LFS payloads
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Download verified bundled database
        shell: pwsh
        run: ./scripts/prepare_bundled_database.ps1

      - name: Fingerprint portable build inputs
        id: build-inputs
        shell: pwsh
        run: |
          "fingerprint=${{ hashFiles('.github/workflows/windows-portable.yml', '.github/actions/prepare-flutter-build/**', 'scripts/package_windows_release.ps1', 'scripts/verify_windows_binary_architecture.ps1', 'scripts/verify_windows_portable_package.ps1', 'scripts/verify_nuget.ps1', 'pubspec.lock', 'pubspec.yaml', 'build.yaml', 'l10n.yaml', 'lib/**', 'windows/**', 'assets/**', 'fonts/**') }}" >> $env:GITHUB_OUTPUT

      - name: Restore exact portable bundle
        id: portable-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUNDLE_PATH }}
          key: ${{ env.WINDOWS_CACHE_NAMESPACE }}-portable-v${{ env.PORTABLE_RECIPE_VERSION }}-${{ env.WINDOWS_ARCHITECTURE }}-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ inputs.build-mode || 'release' }}-${{ steps.build-inputs.outputs.fingerprint }}

      - name: Verify restored portable bundle
        if: steps.portable-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          if (!$match) {
            throw 'pubspec.yaml does not contain a version field.'
          }
          $version = $match.Matches[0].Groups[1].Value.Trim() -replace '\+.*$', ''
          ./scripts/verify_windows_portable_package.ps1 `
            -DirectoryPath $env:BUNDLE_PATH `
            -ExpectedVersion $version

      - name: Prepare incremental Flutter build
        if: steps.portable-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prepare-flutter-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache-namespace: ${{ env.WINDOWS_CACHE_NAMESPACE }}
          cache-flutter-sdk: ${{ vars.WINDOWS_FLUTTER_SDK_CACHE || 'true' }}
          cache-pub-dependencies: ${{ vars.WINDOWS_PUB_CACHE || 'true' }}
          cache-windows-build: "true"

      - name: Setup NuGet
        if: steps.portable-cache.outputs.cache-hit != 'true'
        uses: NuGet/setup-nuget@v4
        with:
          nuget-version: latest

      - name: Verify NuGet
        if: steps.portable-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/verify_nuget.ps1

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build Windows portable
        if: steps.portable-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: flutter build windows --$env:BUILD_MODE --no-pub

      - name: Package user-ready x64 artifacts
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          if (!$match) {
            throw 'pubspec.yaml does not contain a version field.'
          }
          $version = $match.Matches[0].Groups[1].Value.Trim() -replace '\+.*$', ''
          $configuration = if ($env:BUILD_MODE -eq 'debug') { 'Debug' } else { 'Release' }
          ./scripts/package_windows_release.ps1 `
            -Version $version `
            -BuildMode $configuration `
            -Architecture $env:WINDOWS_ARCHITECTURE `
            -SkipFlutterBuild
          $archive = [IO.Path]::GetFullPath(
            (Join-Path $env:GITHUB_WORKSPACE "dist/NAI_Launcher_Windows_x64_${version}_Portable.zip")
          )
          $installer = [IO.Path]::GetFullPath(
            (Join-Path $env:GITHUB_WORKSPACE "dist/NAI_Launcher_Windows_x64_${version}_Setup.exe")
          )
          ./scripts/verify_windows_portable_package.ps1 `
            -ArchivePath $archive `
            -ExpectedVersion $version
          "archive-path=$archive" >> $env:GITHUB_OUTPUT
          "installer-path=$installer" >> $env:GITHUB_OUTPUT

      - name: Verify x64 release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          $version = $match.Matches[0].Groups[1].Value.Trim()
          ./scripts/generate_release_metadata.ps1 `
            -AssetDirectory dist `
            -OutputDirectory dist `
            -Version $version `
            -Tag "windows-build-${{ github.run_number }}" `
            -Repository '${{ github.repository }}'
          $manifest = Get-Content -LiteralPath dist/release_manifest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $types = @($manifest.assets | ForEach-Object { $_.type } | Sort-Object)
          $expected = @('windows-x64-installer', 'windows-x64-portable')
          if (($types -join ',') -ne ($expected -join ',')) {
            throw "Unexpected Windows release asset types: $($types -join ', ')"
          }

      - name: Save exact portable bundle
        if: steps.portable-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BUNDLE_PATH }}
          key: ${{ env.WINDOWS_CACHE_NAMESPACE }}-portable-v${{ env.PORTABLE_RECIPE_VERSION }}-${{ env.WINDOWS_ARCHITECTURE }}-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ inputs.build-mode || 'release' }}-${{ steps.build-inputs.outputs.fingerprint }}

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v6
        with:
          name: nai-launcher-windows-x64-${{ inputs.build-mode || 'release' }}
          path: |
            ${{ steps.package.outputs.archive-path }}
            ${{ steps.package.outputs.installer-path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
