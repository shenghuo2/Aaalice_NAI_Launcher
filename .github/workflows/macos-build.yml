name: macOS Build
run-name: macOS split release build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/macos-build.yml"
      - ".github/workflows/release.yml"
      - "scripts/build_macos_arch.sh"
      - "scripts/test_macos_upgrade_compatibility.sh"
      - "scripts/generate_release_metadata.ps1"
      - "lib/core/services/app_installation_service.dart"
      - "lib/data/datasources/remote/github_api_service.dart"
      - "lib/data/models/version/release_asset_info.dart"

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2"
  PUB_HOSTED_URL: "https://pub.dev"
  UPSTREAM_MACOS_BASELINE_ASSET: "NAI_Launcher_macOS_3.0.0+36_Portable.zip"
  UPSTREAM_MACOS_BASELINE_URL: "https://github.com/Aaalice233/Aaalice_NAI_Launcher/releases/download/v3.0.0/NAI_Launcher_macOS_3.0.0%2B36_Portable.zip"
  UPSTREAM_MACOS_CHECKSUMS_URL: "https://github.com/Aaalice233/Aaalice_NAI_Launcher/releases/download/v3.0.0/checksums.txt"

jobs:
  build:
    name: Build macOS ${{ matrix.display_name }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            display_name: Apple Silicon
          - architecture: x64
            display_name: Intel

    steps:
      - name: Checkout without LFS payloads
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Download verified bundled database
        shell: pwsh
        run: ./scripts/prepare_bundled_database.ps1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare CocoaPods
        run: pod --version

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Validate bundled autocomplete databases
        run: dart run tool/tag_catalog/verify_bundled_databases.dart

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated files
        run: git diff --exit-code -- lib

      - name: Test split macOS release selection
        if: matrix.architecture == 'arm64'
        run: |
          flutter test \
            test/core/services/app_installation_service_test.dart \
            test/data/models/version/release_asset_info_test.dart \
            test/data/datasources/remote/github_api_service_test.dart

      - name: Build and verify macOS ${{ matrix.display_name }} release
        run: ./scripts/build_macos_arch.sh "${{ matrix.architecture }}"

      - name: Test replacement of upstream universal macOS app
        run: |
          ./scripts/test_macos_upgrade_compatibility.sh \
            "${{ matrix.architecture }}" \
            "build/macos/Build/Products/Release/Aaalice NAI Launcher.app" \
            "$UPSTREAM_MACOS_BASELINE_URL" \
            "$UPSTREAM_MACOS_CHECKSUMS_URL" \
            "$UPSTREAM_MACOS_BASELINE_ASSET"

      - name: Package macOS artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml)"
          version="${app_version%%+*}"
          file_name="NAI_Launcher_macOS_${{ matrix.architecture }}_${version}_${GITHUB_SHA::7}_Portable.zip"
          output="$GITHUB_WORKSPACE/dist/$file_name"
          mkdir -p dist
          cd "build/macos/Build/Products/Release"
          ditto -c -k --sequesterRsrc --keepParent "Aaalice NAI Launcher.app" "$output"
          cd "$GITHUB_WORKSPACE/dist"
          shasum -a 256 "$file_name" > "$file_name.sha256"
          echo "archive=$output" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: nai-launcher-macos-${{ matrix.architecture }}-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  verify:
    name: Verify split macOS artifacts
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout metadata generator
        uses: actions/checkout@v6

      - name: Download split macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nai-launcher-macos-*-${{ github.run_number }}
          path: macos-artifacts
          merge-multiple: true

      - name: Verify archive checksums
        run: cd macos-artifacts && sha256sum --check *.sha256

      - name: Generate split release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          if (!$match) {
            throw 'pubspec.yaml does not contain a version field.'
          }
          $version = $match.Matches[0].Groups[1].Value.Trim()
          ./scripts/generate_release_metadata.ps1 `
            -AssetDirectory macos-artifacts `
            -OutputDirectory macos-artifacts `
            -Version $version `
            -Tag "macos-build-${{ github.run_number }}" `
            -Repository '${{ github.repository }}'

          $manifest = Get-Content `
            -LiteralPath macos-artifacts/release_manifest.json `
            -Raw `
            -Encoding UTF8 | ConvertFrom-Json
          $types = @($manifest.assets | ForEach-Object { $_.type } | Sort-Object)
          $expected = @('macos-arm64-portable', 'macos-x64-portable')
          if (($types -join ',') -ne ($expected -join ',')) {
            throw "Unexpected macOS release asset types: $($types -join ', ')"
          }
