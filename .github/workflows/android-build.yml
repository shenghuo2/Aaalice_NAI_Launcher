name: Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2"

jobs:
  build:
    name: Build installable split Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout without LFS payloads
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Download verified bundled database
        shell: pwsh
        run: ./scripts/prepare_bundled_database.ps1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Validate bundled autocomplete databases
        run: dart run tool/tag_catalog/verify_bundled_databases.dart

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated files
        run: git diff --exit-code

      - name: Build release-mode split and compatibility APKs
        run: |
          flutter build apk --release
          mkdir -p build/app/outputs/compatibility-apk
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/compatibility-apk/app-release.apk
          flutter build apk --release --split-per-abi

      - name: Verify and prepare APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"

          app_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml)"
          if [[ ! "$app_version" =~ ^(.+)\+([0-9]+)$ ]]; then
            echo "Unable to read an Android version and numeric build number from pubspec.yaml." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          version_code="${BASH_REMATCH[2]}"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          mkdir -p dist

          packages=(
            "build/app/outputs/compatibility-apk/app-release.apk|armeabi-v7a,arm64-v8a,x86_64|NAI_Launcher_Android_${version}_${GITHUB_SHA::7}.apk"
            "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk|arm64-v8a|NAI_Launcher_Android_arm64-v8a_${version}_${GITHUB_SHA::7}.apk"
            "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk|armeabi-v7a|NAI_Launcher_Android_armeabi-v7a_${version}_${GITHUB_SHA::7}.apk"
            "build/app/outputs/flutter-apk/app-x86_64-release.apk|x86_64|NAI_Launcher_Android_x86_64_${version}_${GITHUB_SHA::7}.apk"
          )
          for package in "${packages[@]}"; do
            IFS='|' read -r apk expected_abis file_name <<< "$package"
            test -s "$apk"
            "$apksigner" verify --verbose --print-certs "$apk"

            badging="$("$aapt" dump badging "$apk")"
            package_line="$(sed -n '1p' <<< "$badging")"
            if [[ "$package_line" != *"name='com.aaalice.nai_launcher'"* || \
                  "$package_line" != *"versionCode='$version_code'"* || \
                  "$package_line" != *"versionName='$version'"* ]]; then
              echo "Android APK package/version mismatch: $package_line" >&2
              exit 1
            fi
            native_line="$(sed -nE '/^native-code: /p' <<< "$badging")"
            mapfile -t actual_abis < <(grep -oE "'[^']+'" <<< "$native_line" | tr -d "'" | sort)
            mapfile -t wanted_abis < <(tr ',' '\n' <<< "$expected_abis" | sort)
            if [[ "${actual_abis[*]}" != "${wanted_abis[*]}" ]]; then
              echo "$apk ABI mismatch: expected ${wanted_abis[*]}, found ${actual_abis[*]:-none}" >&2
              exit 1
            fi

            cp "$apk" "dist/$file_name"
            (cd dist && sha256sum "$file_name" > "$file_name.sha256")
          done

      - name: Verify split release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          $version = $match.Matches[0].Groups[1].Value.Trim()
          ./scripts/generate_release_metadata.ps1 `
            -AssetDirectory dist `
            -OutputDirectory dist `
            -Version $version `
            -Tag "android-build-${{ github.run_number }}" `
            -Repository '${{ github.repository }}'
          $manifest = Get-Content -LiteralPath dist/release_manifest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $types = @($manifest.assets | ForEach-Object { $_.type } | Sort-Object)
          $expected = @(
            'android-apk',
            'android-arm64-v8a-apk',
            'android-armeabi-v7a-apk',
            'android-x86_64-apk'
          ) | Sort-Object
          if (($types -join ',') -ne ($expected -join ',')) {
            throw "Unexpected Android release asset types: $($types -join ', ')"
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAI-Launcher-Android-${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
